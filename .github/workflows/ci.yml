name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgsl-dev python3 python3-numpy python3-matplotlib gnuplot

      - name: Build solver
        run: |
          make clean
          make

      - name: Run spherical and non-spherical test suite
        run: |
          make test-all

      - name: Verify CLI help and argument parsing
        run: |
          ./build/facdes_solver --help
          ./build/facdes_solver --potential 14
